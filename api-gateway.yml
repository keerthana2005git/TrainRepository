server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/customers/**, /api/v1/admin/customers/**

        - id: train-service
          uri: lb://TRAIN-SERVICE
          predicates:
            - Path=/api/v1/trains/**, /api/v1/admin/trains/**

        - id: station-route-service
          uri: lb://STATION-ROUTE-SERVICE
          predicates:
            - Path=/api/v1/stations/**, /api/v1/routes/**, /api/v1/admin/stations/**, /api/v1/admin/routes/**

        - id: schedule-fare-service
          uri: lb://SCHEDULE-FARE-SERVICE
          predicates:
            - Path=/api/v1/schedules/**, /api/v1/fares/**, /api/v1/admin/schedules/**, /api/v1/admin/fares/**

        - id: inventory-quota-service
          uri: lb://INVENTORY-QUOTA-SERVICE
          predicates:
            - Path=/api/v1/inventory/**, /api/v1/quotas/**, /api/v1/admin/coaches/**, /api/v1/admin/quotas/**

        - id: search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/api/v1/search/**

        - id: reservation-service
          uri: lb://RESERVATION-SERVICE
          predicates:
            - Path=/api/v1/reservations/**, /api/v1/admin/reservations/**, /api/v1/tickets/**, /api/v1/food/**, /api/v1/admin/food/**

        - id: payment-refund-service
          uri: lb://PAYMENT-REFUND-SERVICE
          predicates:
            - Path=/api/v1/payments/**, /api/v1/refunds/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**

        # OpenAPI / Swagger Documentation Routes
        - id: openapi-auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - SetPath=/v3/api-docs

        - id: openapi-customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/v3/api-docs/customer-service
          filters:
            - SetPath=/v3/api-docs

        - id: openapi-train-service
          uri: lb://TRAIN-SERVICE
          predicates:
            - Path=/v3/api-docs/train-service
          filters:
            - SetPath=/v3/api-docs

        - id: openapi-station-route-service
          uri: lb://STATION-ROUTE-SERVICE
          predicates:
            - Path=/v3/api-docs/station-route-service
          filters:
            - SetPath=/v3/api-docs

        - id: openapi-schedule-fare-service
          uri: lb://SCHEDULE-FARE-SERVICE
          predicates:
            - Path=/v3/api-docs/schedule-fare-service
          filters:
            - SetPath=/v3/api-docs

        - id: openapi-inventory-quota-service
          uri: lb://INVENTORY-QUOTA-SERVICE
          predicates:
            - Path=/v3/api-docs/inventory-quota-service
          filters:
            - SetPath=/v3/api-docs

        - id: openapi-search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/v3/api-docs/search-service
          filters:
            - SetPath=/v3/api-docs

        - id: openapi-reservation-service
          uri: lb://RESERVATION-SERVICE
          predicates:
            - Path=/v3/api-docs/reservation-service
          filters:
            - SetPath=/v3/api-docs

        - id: openapi-payment-refund-service
          uri: lb://PAYMENT-REFUND-SERVICE
          predicates:
            - Path=/v3/api-docs/payment-refund-service
          filters:
            - SetPath=/v3/api-docs

        - id: openapi-notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    persist-authorization: true
    urls:
      - name: 01. Auth Service
        url: /v3/api-docs/auth-service
      - name: 02. Customer Service
        url: /v3/api-docs/customer-service
      - name: 03. Train Service
        url: /v3/api-docs/train-service
      - name: 04. Station Route Service
        url: /v3/api-docs/station-route-service
      - name: 05. Schedule Fare Service
        url: /v3/api-docs/schedule-fare-service
      - name: 06. Inventory Quota Service
        url: /v3/api-docs/inventory-quota-service
      - name: 07. Search Service
        url: /v3/api-docs/search-service
      - name: 08. Reservation Service
        url: /v3/api-docs/reservation-service
      - name: 09. Payment Refund Service
        url: /v3/api-docs/payment-refund-service
      - name: 10. Notification Service
        url: /v3/api-docs/notification-service