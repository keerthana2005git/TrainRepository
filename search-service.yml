server:
  port: 8087

spring:
  application:
    name: SEARCH-SERVICE

resilience4j:
  circuitbreaker:
    instances:
      searchService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      searchService:
        maxAttempts: 3
        waitDuration: 500ms