server.port=8088
spring.application.name=RESERVATION-SERVICE

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/railway_reservation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=false

resilience4j.circuitbreaker.instances.reservationService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.reservationService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.reservationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.reservationService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.reservationService.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.reservationService.maxAttempts=3
resilience4j.retry.instances.reservationService.waitDuration=500ms
